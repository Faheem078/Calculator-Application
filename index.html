<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Basic Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" role="application" aria-label="Basic calculator">
    <div class="help">
      <div>Basic Calculator</div>
      <div>Keyboard: 0-9 . + - * / Enter = Backspace Esc(C)</div>
    </div>

    <div class="screen" id="screen" aria-live="polite">
      <div id="expression" class="expr" aria-label="Expression">0</div>
      <div id="result" class="result" aria-label="Result"></div>
    </div>

    <div class="pad" id="pad">
      <button class="key func" data-action="clear" title="Clear (Esc)">C</button>
      <button class="key func" data-action="back" title="Backspace (Backspace)">⌫</button>
      <button class="key func" data-action="paren" title="Toggle parentheses">( )</button>
      <button class="key op" data-value="÷" title="Divide">÷</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key op" data-value="×" title="Multiply">×</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key op" data-value="-" title="Subtract">−</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key op" data-value="+" title="Add">+</button>

      <button class="key wide" data-value="0">0</button>
      <button class="key" data-value=".">.</button>
      <button class="key equals" data-action="equals" title="Equals (Enter)">=</button>
    </div>
  </main>

<script src="script.js"></script>
</body>
</html>
